<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="PS Stream: PS5 Remote Play built for weak Wi-Fi">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1a52"/>
      <stop offset="1" stop-color="#090b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#4a3fb0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a3fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282462"/>
      <stop offset="1" stop-color="#0a0c24"/>
    </linearGradient>
    <linearGradient id="waves" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d6ff"/>
      <stop offset="1" stop-color="#965cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfc6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#sky)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <!-- Faint waves across the background -->
  <g fill="none" stroke="url(#waves)" stroke-width="2" opacity="0.13">
    <path d="M0 300 C 220 250, 420 340, 640 290 S 1060 240, 1280 290"/>
    <path d="M0 325 C 240 280, 440 360, 660 312 S 1080 265, 1280 318"/>
    <path d="M0 60 C 260 20, 520 100, 760 55 S 1120 20, 1280 50"/>
  </g>
  <!-- The app icon: a Wi-Fi sign whose dot is a play button -->
  <g transform="translate(100 52)">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <g fill="none" stroke="url(#waves)" stroke-width="18.4" stroke-linecap="round">
      <path d="M91.5 150.4 A52.5 52.5 0 0 1 164.5 150.4"/>
      <path d="M68.4 126.5 A85.8 85.8 0 0 1 187.6 126.5"/>
      <path d="M45.3 102.6 A119 119 0 0 1 210.7 102.6"/>
    </g>
    <path d="M113.9 166.9 L113.9 209.4 L150.5 188.2 Z" fill="#fff" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <text x="410" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="84" font-weight="700" fill="url(#title)" letter-spacing="-1">PS Stream</text>
  <text x="414" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#b9b4e8">PS5 Remote Play for Windows, built for weak Wi-Fi</text>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#e9e6ff">
    <rect x="414" y="250" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#36d6ff" stroke-opacity="0.45"/>
    <text x="489" y="277" text-anchor="middle">Audio only</text>
    <rect x="578" y="250" width="186" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#6f9bff" stroke-opacity="0.45"/>
    <text x="671" y="277" text-anchor="middle">Stream to Discord</text>
    <rect x="778" y="250" width="214" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#965cff" stroke-opacity="0.45"/>
    <text x="885" y="277" text-anchor="middle">H.265, less data</text>
  </g>
</svg>
